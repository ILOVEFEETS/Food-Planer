function vSet(){const names=[...Object.keys(STORES),...S.custom.map(c=>c.n)],dt=[['all','Alles'],['veg','Vegetarisch'],['vegan','Vegan']];
 return `<section class=panel><h3>🏪 Meine Läden</h3><div class=chips>${names.map(n=>`<button class="chip ${S.stores.includes(n)?'on':''}" data-a=sto data-n="${esc(n)}">${esc(n)}${S.custom.some(c=>c.n==n)?`<s data-a=del data-n="${esc(n)}" aria-label="Entfernen">✕</s>`:''}</button>`).join('')}</div><div class=add><input id=cn placeholder="Eigener Laden" maxlength=24><select id=cl><option value=.93>günstig</option><option value=1.03 selected>mittel</option><option value=1.15>teuer</option></select><button data-a=addst aria-label="Laden hinzufügen">+</button></div></section>
<section class=panel><h3>💶 Wochenbudget</h3><div class=bvrow><button class=rb data-a=bm aria-label="5 Euro weniger">−</button><div class=bv id=bv>${bvt(S.budget)}</div><button class=rb data-a=bp aria-label="5 Euro mehr">+</button></div><input type=range id=bud min=20 max=300 step=5 value=${S.budget} style="--f:${(S.budget-20)/280}" aria-label="Wochenbudget"><div class=ticks><span>20 €</span><span>100 €</span><span>200 €</span><span>300 €</span></div><div class=chips>${[40,70,100,150,200].map(v=>`<button class="chip ${S.budget==v?'on':''}" data-a=pre data-v=${v}>${v} €</button>`).join('')}</div></section>
<section class=panel><h3>👥 Personen</h3><div class=step><button data-a=nm aria-label="Weniger">−</button><b>${S.n}</b><button data-a=np aria-label="Mehr">+</button></div></section>
<section class=panel><h3>🥗 Ernährung</h3><div class=seg>${dt.map(([k,l])=>`<button class="${S.diet==k?'on':''}" data-a=diet data-v=${k}>${l}</button>`).join('')}</div></section>
<section class=panel><h3>🎨 Design</h3><div class=themes>${TH.map(([k,l,a,b])=>`<button class="th ${S.th==k?'on':''}" data-a=th data-v=${k}><i style="background:linear-gradient(135deg,${a},${b})"></i>${l}</button>`).join('')}</div></section>
<p class=mut>${ALL.filter(ok).length.toLocaleString('de-DE')} Gerichte passen zu deinen Einstellungen.</p><p id=storageStatus class="${storageError?'storage-error':'mut'}" role=status>${storageError||'Wochenplan, Einstellungen, Favoriten und Einkaufs-Häkchen werden automatisch auf diesem Gerät gespeichert. Eine Synchronisierung mit anderen Geräten gibt es nicht.'}</p><button class="big ghost" data-a=intro>Einführung noch einmal ansehen</button>`}
function vModal(id){const r=R(id),f=S.fav.includes(id);
 return `<div class=sheet role=dialog aria-label="${r.name}"><button class=x data-a=close aria-label="Schließen">✕</button><div class=bt>${r.art}</div><h2>${r.name}</h2><div class=mut style="text-align:left;margin:0 0 14px">⏱ ${r.time} Min. &nbsp; ${money(cost(id))} für ${S.n} ${S.n>1?'Personen':'Person'}</div><button class="big ${f?'ghost':''}" data-a=fav data-id="${id}">${f?'♥ Favorit entfernen':'♡ Als Favorit speichern'}</button>
<h4>Zutaten für ${S.n} ${S.n>1?'Personen':'Person'}</h4><ul>${r.ings.map(([k,a])=>`<li><span>${I[k][0]}</span><span>${fmt(a*S.n,I[k][2])}</span></li>`).join('')}</ul>
<h4>Zubereitung</h4><ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
<h4>In den Wochenplan setzen</h4><div class=days>${D.map((d,i)=>`<button class="${S.plan[i]==id?'on':''}" data-a=put data-i=${i}>${d}</button>`).join('')}</div></div>`}
function render(){
 $('#v').innerHTML=S.ob>=0?vOb():{plan:vPlan,shop:vShop,fav:vFav,set:vSet}[S.tab]();document.body.classList.toggle('onb',S.ob>=0);document.documentElement.dataset.th=S.th;$('#tc').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));
 $('#m').classList.toggle('show',!!cur);$('#m').innerHTML=cur?vModal(cur):'';save()}
function prog(){const l=list(),c=l.filter(x=>S.chk[x.k]).length;$('#pg').textContent=`${c} von ${l.length} abgehakt`;$('#pb').style.width=c/l.length*100+'%'}
document.addEventListener('click',e=>{
 if(e.target.id=='m'){cur=null;return render()}
 const el=e.target.closest('[data-a]');if(!el)return;navigator.vibrate&&navigator.vibrate(8);const a=el.dataset.a,d=el.dataset;
 if(a=='chk'){S.chk[d.k]=el.checked;el.closest('.row').classList.toggle('done',el.checked);prog();save();return}
 if(a=='tab'){S.tab=d.t;cur=null;scrollTo(0,0)}
 else if(a=='week')gen([0,1,2,3,4,5,6]);
 else if(a=='swap')gen([+d.i]);
 else if(a=='fav'){const i=S.fav.indexOf(d.id);i<0?S.fav.push(d.id):S.fav.splice(i,1)}
 else if(a=='open')cur=d.id;
 else if(a=='close')cur=null;
 else if(a=='put'){S.plan[+d.i]=cur;S.chk={};cur=null;S.tab='plan';scrollTo(0,0)}
 else if(a=='rst')S.chk={};
 else if(a=='sto'){const i=S.stores.indexOf(d.n);i<0?S.stores.push(d.n):S.stores.splice(i,1);fit()}
 else if(a=='del'){S.custom=S.custom.filter(c=>c.n!=d.n);S.stores=S.stores.filter(n=>n!=d.n);fit()}
 else if(a=='addst'){const n=$('#cn').value.trim();if(n&&!(n in STORES)&&!S.custom.some(c=>c.n==n)){S.custom.push({n,f:+$('#cl').value});S.stores.push(n);fit()}}
 else if(a=='nm'||a=='np'){S.n=Math.max(1,Math.min(8,S.n+(a=='np'?1:-1)));fit()}
 else if(a=='diet'){S.diet=d.v;fit()}
 else if(a=='th')S.th=d.v;
 else if(a=='pre'){S.budget=+d.v;fit()}
 else if(a=='bm'||a=='bp'){S.budget=Math.max(20,Math.min(300,S.budget+(a=='bp'?5:-5)));fit()}
 else if(a=='next'){S.ob++;if(S.ob>5){S.ob=-1;S.tab='plan';gen([0,1,2,3,4,5,6])}scrollTo(0,0)}
 else if(a=='back'){S.ob--;scrollTo(0,0)}
 else if(a=='skip')S.ob=-1;
 else if(a=='intro'){S.ob=0;scrollTo(0,0)}
 render()});
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.classList.contains('it')){e.preventDefault();e.target.click()}if(e.key=='Escape'&&cur){cur=null;render()}});
function bvt(v){const m=x=>x.toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}),p=v/S.n;return `<b>${m(v)}</b><small>${m(p)} pro Person</small><em>${p<18?'Sparfuchs 🦊':p<30?'Ausgewogen 🥘':'Genießer 🥂'}</em>`}
document.addEventListener('input',e=>{if(e.target.id=='bud'){const v=+e.target.value;$('#bv').innerHTML=bvt(v);e.target.style.setProperty('--f',(v-20)/280)}});
let ty=null;
document.addEventListener('touchstart',e=>{const s=e.target.closest('.sheet');ty=s&&s.scrollTop<=0?e.touches[0].clientY:null},{passive:true});
document.addEventListener('touchend',e=>{if(ty!==null&&cur&&e.changedTouches[0].clientY-ty>110){cur=null;render()}ty=null},{passive:true});
document.addEventListener('change',e=>{if(e.target.id=='bud'){S.budget=+e.target.value;fit();render()}});
const refreshWeek=()=>{if(checkWeek())render()};
window.addEventListener('focus',refreshWeek);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshWeek()});
setInterval(refreshWeek,60000);
$('#cnt').textContent=ALL.length.toLocaleString('de-DE')+' Gerichte';
checkWeek();fit();render();
</script>
<script>
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('./service-worker.js')
   .catch(error=>console.error('Die Offline-Funktion konnte nicht aktiviert werden.',error));
 });
}
</script>
</body></html>
